version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Every repo's reviews run the actions pinned here, so let new releases
    # settle before Dependabot proposes them.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
