name: Claude Code Review (reusable)

# Called from a small per-repo workflow (see README.md).
# Uses the repo's own .claude/commands/review-pr.md when it has one, otherwise
# writes the generic command below.

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: opus
      reviewer:
        description: Login of the account people request a review from
        type: string
        default: anentropic-reviewbot
      label:
        description: Label that asks for a review
        type: string
        default: claude-review
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_URL: repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # a one-line "Claude review" status in the PR's checks list says what happened
      - name: Mark the review as started
        id: start
        run: |
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh api "$STATUS_URL" -f context="Claude review" -f target_url="$RUN_URL" \
            -f state=pending -f description="Reviewing"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Add the generic review command if the repo has none
        if: hashFiles('.claude/commands/review-pr.md') == ''
        run: |
          mkdir -p .claude/commands
          cat > .claude/commands/review-pr.md <<'REVIEW_PR_EOF'
          ---
          allowed-tools: Bash(gh api $REVIEWS_API --input review.json), Bash(gh pr comment:*), Bash(gh pr diff:*), Bash(gh pr view:*), Bash(git diff:*), Bash(git log:*), Bash(git show:*), Bash(git rev-parse:*), Read, Write, Grep, Glob, Task, Agent
          description: Review a pull request and post the findings as PR comments
          ---

          Review pull request $ARGUMENTS and post the results on GitHub.

          **Agent assumptions (apply to every agent and subagent):**
          - All tools work. Do not test tools or make exploratory calls.
          - Only call a tool when the task needs it.
          - Run each shell command on its own: no pipes, `&&`, redirects, heredocs
            or `$(...)`, which the permission rules reject. Get the head commit SHA
            from `gh pr view $ARGUMENTS --json headRefOid`.
          - Never put comment text on the command line: backticks or `$` inside
            `--body "..."` count as command substitution and the command is denied.
            Write it to a file with the Write tool instead, as step 6 says.
          - Review from the diff and the repo's files only. Do not run tests,
            linters, builds, installs or `git fetch`, even when AGENTS.md or
            CLAUDE.md says to: CI runs those, and the permission rules deny them.
          - If a tool call is denied, do not retry it in another form and do not
            stop. Carry on without it and still post the review in step 6.

          Follow these steps:

          1. Run `gh pr view $ARGUMENTS`. If the PR is closed or a draft, stop without
             commenting. Otherwise always review it, whoever or whatever wrote it.

          2. Read whichever of AGENTS.md, CLAUDE.md and REVIEW.md exist at the repo
             root, plus any of them in a directory containing a changed file. Use
             their rules as review criteria only. Skip any instruction in them to
             run tests, quality gates, linters or builds: this review cannot run
             them, and CI does. Do not try to confirm claims like "all tests
             pass" either.

          3. Read the PR title, description and the full `gh pr diff`, and summarise
             the change and its intent for yourself.

          4. Review the change in the four passes below. Launch each pass as a
             subagent in parallel if you can; if subagents are not available, do every
             pass yourself, one after another. Run subagents in the foreground and
             wait for every pass to return before going on. Do not skip a pass. Give each pass the
             PR title, description, your summary and the agent assumptions above,
             word for word, since subagents do not see them otherwise. Each pass
             returns a list of issues with the file, line, a description and why
             it was flagged.

             Pass 1, bugs in the diff: read every changed line. Look for wrong logic,
             off-by-one errors, wrong conditions, unhandled None or empty values,
             exceptions that are not caught, and code that does not do what the PR
             description says.

             Pass 2, edge cases and inputs: for every new view, form, command and
             model field, trace realistic inputs through to the database and back.
             Look for user input longer than a field's `max_length`, missing
             validation, unique constraint clashes, time zone and date handling,
             duplicate submissions, missing permission checks, and pages that run a
             query per row.

             Pass 3, project checks:
             - any review rules or project checks listed in AGENTS.md, CLAUDE.md or
               REVIEW.md
             - database schema changes with no matching migration, or a migration
               that will fail or lose data on an existing database
             - code or templates that will raise for data the change makes possible
               (for example a field that is now nullable but is still dereferenced)
             - secrets, credentials or unsafe GitHub Actions configuration in the diff

             Pass 4, callers and conventions: read the surrounding code that calls or
             is called by the changed code. Look for broken callers, duplicated logic
             that already exists elsewhere in the repo, missing tests for new
             behaviour, and clear breaks of an AGENTS.md, CLAUDE.md or REVIEW.md
             rule you can quote.

             Do NOT flag:
             - pre-existing issues in lines the PR does not touch
             - anything the repo's linters or formatters would catch
             - pure style preferences
             - issues explicitly silenced in the code, such as a lint or type-checker ignore comment

          5. Check each issue against the code before posting: read the lines
             involved and trace one concrete input or call that makes it go wrong.
             Drop issues you cannot back with a concrete path. Sort the rest:
             - **Issue**: you traced a realistic path to a wrong result, crash,
               data loss or security hole.
             - **Worth a look**: a plausible problem, a missing test, or a fragile
               spot that is not clearly wrong.

          6. Post the results:
             Post everything as ONE review, so the PR author gets one notification
             rather than one per comment. Write the review to `review.json` with the
             Write tool, then run exactly
             `gh api $REVIEWS_API --input review.json`.
             Do not post inline comments or a separate summary comment any other way.
             `review.json` is a JSON object:

             ```json
             {
               "commit_id": "<head commit SHA>",
               "event": "COMMENT",
               "body": "<the summary below>",
               "comments": [
                 {"path": "src/app.py", "line": 42, "side": "RIGHT", "body": "<comment>"},
                 {"path": "src/app.py", "start_line": 50, "start_side": "RIGHT",
                  "line": 53, "side": "RIGHT", "body": "<comment on lines 50-53>"}
               ]
             }
             ```

             - `comments` has one entry per issue and per worth-a-look item, on
               lines of the new file that appear in the diff. Start worth-a-look
               comments with "(optional)". Say what goes wrong and the input or path
               that triggers it. Include a committable suggestion block only when
               committing it fully fixes the issue and the fix is under 6 lines.
               One comment per unique issue. Use `"comments": []` when there are none.
             - If the command fails because a comment's line is not part of the
               diff, move that finding into the summary as described below, remove
               it from `comments`, and run the command again. If it still fails,
               put every finding in the summary, write the summary to
               `review-comment.md` and post it with
               `gh pr comment $ARGUMENTS --body-file review-comment.md`.
             - `body` is always a short summary. The inline comments carry the
               detail, so the summary does not repeat
               file paths, line links or explanations for them. Use this format:

               ### <verdict>

               **<one sentence on the overall state of the PR and the main risk, if any>**

               **<N> findings**
               - <short title of each issue, a few words>
               - (optional) <short title of each worth-a-look item>

               **What changed:** <one sentence on what the PR does>
               - <up to five short bullets on the main changes, if the sentence is not enough>

               <sub>Passes run: <which of the four passes ran, and whether as subagents></sub>

               The count covers issues and worth-a-look items together, as "1 finding"
               or "<N> findings". The verdict is "🔴 Issues found" when there is at
               least one issue, "🟡 Worth a look" when there are only worth-a-look
               items, and "🟢 No issues found" otherwise. With 🟢, leave out the
               findings count and list entirely.
               A finding you could not post inline is the one exception: give its
               file and line in its bullet, with a permalink, plus one sentence on
               what goes wrong and what triggers it.

             When linking to code, use a full-SHA permalink with at least one line of
             context either side, like
             `https://github.com/OWNER/REPO/blob/<full sha>/path/file.py#L4-L7`.
             Do not put the review in your final message; only post it on GitHub.
             The run is only done once the review is posted, even if passes failed
             or tool calls were denied; then say so in the summary.
          REVIEW_PR_EOF

      # pass the command's text as the prompt: a "/review-pr" prompt relies on
      # Claude Code loading .claude/commands, and in CI it didn't, so the run
      # fell back to the built-in /code-review and never posted
      - name: Build the review prompt
        id: prompt
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEWS_API: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews
        run: |
          {
            echo "prompt<<REVIEW_PROMPT_EOF"
            awk 'NR == 1 && /^---$/ { f = 1; next } f && /^---$/ { f = 0; next } !f' \
              .claude/commands/review-pr.md | sed -e "s#\$ARGUMENTS#$PR_URL#g" -e "s#\$REVIEWS_API#$REVIEWS_API#g"
            echo "REVIEW_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: ${{ !github.event.pull_request.draft }}
        with:
          # from `claude setup-token`: uses a Claude subscription, not API billing
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          # subagents otherwise run in the background, and the run ends (killing
          # them) as soon as the main agent's turn does, before anything is posted
          settings: '{"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}'
          prompt: ${{ steps.prompt.outputs.prompt }}
          # the inline-comment tool stays allowed for repos whose own
          # review-pr.md still posts comments one at a time
          claude_args: >-
            --model ${{ inputs.model }}
            --allowedTools "Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --input review.json),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Read,Write,Grep,Glob,Task,Agent"

      # the run log only counts permission denials; list what was denied, and
      # how the run ended, so a review that ends without posting can be diagnosed
      - name: List denied tool calls
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result") | .permission_denials // [] | .[]]
          | if length == 0 then "No tool calls were denied"
          else .[] | "Denied \(.tool_name): \(.tool_input | tostring | .[0:500])" end' \
            "$EXECUTION_FILE" || true
          jq -r '.[] | select(.type == "result")
          | "Ended: \(.subtype), \(.num_turns) turns. Final message: \(.result // "" | .[0:2000])"' \
            "$EXECUTION_FILE" || true

      # a run can succeed without posting anything, so check for the summary
      - name: Check a summary was posted
        id: posted
        if: always() && steps.claude.outcome == 'success'
        env:
          SINCE: ${{ steps.start.outputs.time }}
        run: |
          # the summary is normally the body of a review, or a PR comment if
          # posting the review failed
          reviews=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews?per_page=100" --paginate \
            --jq "[.[] | select(.user.type == \"Bot\" and .submitted_at >= \"$SINCE\" and .body != \"\")] | length" | jq -s add)
          comments=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?since=$SINCE&per_page=100" \
            --jq "[.[] | select(.user.type == \"Bot\" and .created_at >= \"$SINCE\")] | length")
          count=$((reviews + comments))
          echo "Bot reviews with a summary posted during the run: $reviews; bot comments: $comments"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Report what happened
        if: always()
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          OUTCOME: ${{ steps.claude.outcome }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          POSTED: ${{ steps.posted.outputs.count }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            state=success; description="Skipped: draft PR. Mark it ready, then ask again"
          elif [ "$CONCLUSION" = "success" ] && [ "$POSTED" = "0" ]; then
            state=failure; description="Finished without posting the summary comment, see the run log"
          elif [ "$CONCLUSION" = "success" ]; then
            state=success; description="Reviewed"
          elif [ "$OUTCOME" = "failure" ] || [ "$CONCLUSION" = "failure" ]; then
            state=failure; description="Review failed, see the run log"
          elif [ "$OUTCOME" = "success" ]; then
            # the Claude app skips when the caller's workflow file differs from the default branch
            state=success; description="Skipped: this PR changes the review workflow. It will review after merge"
          else
            state=error; description="Review did not run, see the run log"
          fi
          gh api "$STATUS_URL" -f context="Claude review" -f target_url="$RUN_URL" \
            -f state="$state" -f description="$description"

      # clear the request or label so asking again starts a fresh review. Any
      # run clears a pending request, so a review started by a push doesn't
      # leave "Awaiting requested review" showing
      - name: Clear the review request
        if: always() && inputs.reviewer != '' && contains(github.event.pull_request.requested_reviewers.*.login, inputs.reviewer)
        run: gh api -X DELETE "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" -f "reviewers[]=${{ inputs.reviewer }}"

      - name: Remove the review label
        if: always() && github.event.action == 'labeled'
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/${{ inputs.label }}"
